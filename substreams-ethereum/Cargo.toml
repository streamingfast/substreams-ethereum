[package]
name = "substreams-ethereum"
version.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
num-bigint = "0.4.3"
substreams = { workspace = true }
substreams-ethereum-abigen = { workspace = true }
substreams-ethereum-derive = { workspace = true }
substreams-ethereum-core = { workspace = true }

# Registers the custom hook `init!()` installs, so a dependency reaching for
# randomness fails rather than pulling an implementation into the module.
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2.10", features = ["custom"] }

[dev-dependencies]
anyhow = "1"
ethabi = "17"
